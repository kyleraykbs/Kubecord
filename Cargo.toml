[workspace]
resolver = "3"
members = [
  "crates/kc-core",
  "crates/kc-state",
  "crates/kc-http",
  "crates/kc-gateway",
  "crates/kc-voice",
  "crates/kc-media",
  "crates/kc-ui",
  "crates/kc-probe",
  "crates/kubecord",
]

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.98"
license = "GPL-3.0-only"
repository = "https://github.com/kyleraykbs/Kubecord"

[workspace.dependencies]
kc-core = { path = "crates/kc-core" }
kc-state = { path = "crates/kc-state" }
kc-http = { path = "crates/kc-http" }
kc-gateway = { path = "crates/kc-gateway" }
kc-voice = { path = "crates/kc-voice" }
kc-media = { path = "crates/kc-media" }
kc-ui = { path = "crates/kc-ui" }

aes-gcm = "0.10"
ashpd = { version = "0.14", features = ["screencast", "camera", "pipewire", "gtk4"] }
anyhow = "1"
base64 = "0.22"
bytes = "1"
chacha20poly1305 = "0.10"
davey = "0.2"
dirs = "6"
flate2 = "1"
futures-util = "0.3"
glib = "0.22"
gstreamer = "0.25"
gstreamer-app = "0.25"
gstreamer-video = "0.25"
gtk = { package = "gtk4", version = "0.11" }
libadwaita = "0.9"
webkit6 = "0.6"
opus2 = "0.4"
parking_lot = "0.12"
# Connections to Discord go through wreq on BoringSSL, the TLS library
# Chrome uses, with wreq-util's Chrome profile: what Discord sees of the
# connection (TLS hello, HTTP/2 settings) is Chrome's, not Rust's.
wreq = { version = "0.16.1", default-features = false, features = ["tokio-rt", "chromium-roots", "cookies", "gzip", "deflate", "brotli", "zstd", "json", "multipart", "stream", "ws"] }
wreq-util = { git = "https://github.com/0x676e67/wreq-util", rev = "917d2581d6761a94db66466caa6c2eb4d4cdbd43", default-features = false, features = ["emulation", "emulation-chromium-pki"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }
zeroize = "1"

[profile.release]
lto = "thin"

# wreq-util's Chrome 152+ profiles need wreq and BoringSSL changes not yet
# released; these are the commits wreq-util itself is built and tested on.
[patch.crates-io]
wreq = { git = "https://github.com/0x676e67/wreq", rev = "cd76bcdf1307153de289d34e072528bdf0510a3b" }
btls = { git = "https://github.com/0x676e67/btls", rev = "129887582a538b8f4dcf371d15c953335312ca37" }
btls-sys = { git = "https://github.com/0x676e67/btls", rev = "129887582a538b8f4dcf371d15c953335312ca37" }
