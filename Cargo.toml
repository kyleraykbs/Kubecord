[workspace]
resolver = "3"
members = [
  "crates/kc-core",
  "crates/kc-state",
  "crates/kc-http",
  "crates/kc-gateway",
  "crates/kc-voice",
  "crates/kc-media",
  "crates/kc-ui",
  "crates/kc-probe",
  "crates/kylecord",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
license = "GPL-3.0-only"
repository = "https://github.com/kyleraykbs/kylecord"

[workspace.dependencies]
kc-core = { path = "crates/kc-core" }
kc-state = { path = "crates/kc-state" }
kc-http = { path = "crates/kc-http" }
kc-gateway = { path = "crates/kc-gateway" }
kc-voice = { path = "crates/kc-voice" }
kc-media = { path = "crates/kc-media" }
kc-ui = { path = "crates/kc-ui" }

aes-gcm = "0.10"
ashpd = { version = "0.14", features = ["screencast", "camera", "pipewire", "gtk4"] }
anyhow = "1"
base64 = "0.22"
bytes = "1"
chacha20poly1305 = "0.10"
davey = "0.2"
dirs = "6"
flate2 = "1"
futures-util = "0.3"
glib = "0.22"
gstreamer = "0.25"
gstreamer-app = "0.25"
gstreamer-video = "0.25"
gtk = { package = "gtk4", version = "0.11" }
libadwaita = "0.9"
webkit6 = "0.6"
opus2 = "0.4"
parking_lot = "0.12"
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "rustls-tls-webpki-roots", "gzip", "brotli"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }

[profile.release]
lto = "thin"