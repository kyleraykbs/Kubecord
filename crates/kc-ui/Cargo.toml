[package]
name = "kc-ui"
description = "GTK4/libadwaita interface for kubecord"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
ashpd.workspace = true
anyhow.workspace = true
async-channel = "2"
# Standard emoji for the picker: characters, names, groups, shortcodes.
emojis = "0.9"
# Decompressing the bundled spell-check word list (already in the tree).
flate2 = "1"
glib.workspace = true
gstreamer.workspace = true
gtk = { workspace = true, features = ["v4_14"] }
# WebP has no GdkPixbuf loader on most systems; decode it in-process.
image-webp = "0.2"
kc-core.workspace = true
kc-gateway.workspace = true
kc-http.workspace = true
kc-media.workspace = true
kc-state.workspace = true
kc-voice.workspace = true
libadwaita = { workspace = true, features = ["v1_7"] }
# Registering a downloaded font file at run time (FontMap::add_font_file).
pango = { version = "0.22", features = ["v1_56"] }
# Discord's font arrives as WOFF2, which Pango will not use: unwrap it to TTF.
woff2-patched = "0.4"
# Finding Discord's sound files in its web app's script bundles.
regex = "1"
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
webkit6 = { workspace = true, optional = true }
rusqlite = { version = "0.43.0", features = ["bundled"] }
# Telling niri the window needs no backdrop behind it (see `decorations`):
# GTK's own Wayland connection, and KDE's server-decoration protocol.
gdk4-wayland = { version = "0.11", features = ["wayland_crate"] }
wayland-client = "0.31"
wayland-protocols-plasma = { version = "0.3", features = ["client"] }
two-face = { version = "0.5.2", default-features = false, features = ["syntect-default-fancy"] }
syntect = { version = "5.3.0", default-features = false, features = ["default-fancy"] }

[features]
# Solve Discord's captchas in an embedded WebKitGTK view.
captcha = ["dep:webkit6"]
